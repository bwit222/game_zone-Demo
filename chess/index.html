<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chess • Game Zone</title>
  <meta name="description" content="Play classic chess against a friend or an intelligent AI with multiple difficulty levels.">
  
  <!-- Google Fonts: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient background glow lights -->
  <div class="ambient-glow glow-purple" aria-hidden="true"></div>
  <div class="ambient-glow glow-cyan" aria-hidden="true"></div>

  <div class="game-wrapper">
    <!-- Top Navigation Header -->
    <header class="game-header">
      <div class="header-left">
        <a href="../index.html" class="nav-home-btn" title="Back to Game Zone Home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          <span>Home</span>
        </a>
        <div class="game-brand">
          <span class="game-brand-icon">♘</span>
          <h1 class="game-title">Chess<span>Master</span></h1>
        </div>
      </div>

      <div class="header-right">
        <!-- Sound Toggle -->
        <button id="sound-toggle-btn" class="icon-action-btn" title="Toggle Sound">
          <svg id="sound-on-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          <svg id="sound-off-svg" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>

        <!-- New Game / Restart -->
        <button id="restart-game-btn" class="icon-action-btn" title="Restart Match">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <path d="M3 3v5h5"></path>
          </svg>
        </button>
        <button id="new-game-btn" class="btn btn-secondary btn-small">New Game</button>
      </div>
    </header>

    <!-- Main Game Area -->
    <main class="main-layout hidden" id="game-container">
      
      <!-- Opponent Info (Top) -->
      <section class="player-hud glass-panel" id="hud-black">
        <div class="player-info">
          <div class="player-avatar bg-black">
            <span class="avatar-piece">♚</span>
          </div>
          <div class="player-details">
            <span class="player-name" id="name-black">Black</span>
            <span class="player-status" id="status-black">Waiting...</span>
          </div>
        </div>
        <div class="captured-pieces" id="captured-by-black">
          <!-- Captured white pieces go here -->
        </div>
      </section>

      <!-- Center Board Area -->
      <section class="board-section">
        <!-- Game Status Message -->
        <div class="game-message-container">
          <div id="game-status-msg" class="status-msg glow-text">White's Turn</div>
        </div>

        <!-- The Chess Board -->
        <div class="chess-board-outer">
          <div class="chess-board" id="chess-board">
            <!-- 64 squares generated by JS -->
          </div>
        </div>
      </section>

      <!-- Player Info (Bottom) -->
      <section class="player-hud glass-panel active-turn" id="hud-white">
        <div class="player-info">
          <div class="player-avatar bg-white">
            <span class="avatar-piece">♔</span>
          </div>
          <div class="player-details">
            <span class="player-name" id="name-white">White</span>
            <span class="player-status" id="status-white">Your Turn</span>
          </div>
        </div>
        <div class="captured-pieces" id="captured-by-white">
          <!-- Captured black pieces go here -->
        </div>
      </section>
    </main>
  </div>

  <!-- Game Mode Selection Modal -->
  <div id="mode-modal" class="modal-backdrop" role="dialog" aria-modal="true">
    <div class="modal-content glass-panel">
      <div class="modal-icon">♘</div>
      <h2 class="modal-title">Choose Game Mode</h2>
      
      <div class="mode-options">
        <button class="mode-btn" id="mode-friend">
          <span class="mode-icon">👥</span>
          <div class="mode-text">
            <strong>Play vs Friend</strong>
            <span>Local 2-player mode</span>
          </div>
        </button>
        
        <button class="mode-btn" id="mode-ai">
          <span class="mode-icon">🤖</span>
          <div class="mode-text">
            <strong>Play vs AI</strong>
            <span>Challenge the computer</span>
          </div>
        </button>
      </div>

      <!-- AI Difficulty Selection (Hidden initially) -->
      <div id="ai-difficulty-section" class="hidden">
        <h3 class="sub-title">Select Difficulty</h3>
        <div class="difficulty-options">
          <button class="diff-btn" data-diff="basic">
            <strong>Basic</strong>
            <span>Beginner friendly</span>
          </button>
          <button class="diff-btn active" data-diff="standard">
            <strong>Standard</strong>
            <span>Moderate challenge</span>
          </button>
          <button class="diff-btn" data-diff="advanced">
            <strong>Advanced</strong>
            <span>Strong strategic AI</span>
          </button>
        </div>
        <button id="start-ai-game-btn" class="btn btn-primary mt-4">Start Game</button>
      </div>
    </div>
  </div>

  <!-- Promotion Modal -->
  <div id="promotion-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div class="modal-content glass-panel promotion-content">
      <h3 class="modal-title">Promote Pawn</h3>
      <div class="promotion-options" id="promotion-options">
        <!-- Buttons injected by JS depending on color -->
      </div>
    </div>
  </div>

  <!-- Game Over Modal -->
  <div id="game-over-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div class="modal-content glass-panel">
      <div class="modal-icon" id="game-over-icon">🏆</div>
      <h2 id="game-over-title" class="modal-title">Checkmate!</h2>
      <p id="game-over-desc" class="modal-desc">White Wins!</p>
      
      <div class="modal-actions">
        <button id="modal-play-again-btn" class="btn btn-primary">Play Again</button>
        <button id="modal-new-game-btn" class="btn btn-secondary">Change Mode</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
